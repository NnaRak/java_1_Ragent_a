server:
  port: 9091
  servlet:
    context-path: /api/rag-ingest

spring:
  application:
    name: rag-ingest
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:55432/rag_agent}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

rag:
  ingestion:
    collection-name: ${RAG_COLLECTION_NAME:readme_ingest}
    kb-name: README 知识库
    # 知识库元数据中记录的模型别名；实际请求模型见 rag.embedding.model
    embedding-model: qwen-emb-8b
    max-file-size: 10MB
    chunk:
      max-chars: 1024
      overlap-chars: 128
      min-chars: 200
  embedding:
    provider: ${RAG_EMBEDDING_PROVIDER:bailian}
    base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com}
    path: /compatible-mode/v1/embeddings
    api-key: ${BAILIAN_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-v4}
    dimension: 1536
    batch-size: 10
    timeout-seconds: 60
    max-retries: 3
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9100}
    access-key: ${S3_ACCESS_KEY:rustfsadmin}
    secret-key: ${S3_SECRET_KEY:rustfsadmin}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:rag-agent-sources}
    path-style: true
  web:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

logging:
  level:
    com.ragent: DEBUG
